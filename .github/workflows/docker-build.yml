name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'modules/**'
      - 'webapp/**'
      - 'pyproject.toml'
      - 'VERSION'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/selffarm-lite

jobs:
  build-and-push:
    name: Build multi-arch & push GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=SelfFarm-Lite
            org.opencontainers.image.description=Étage applicatif agricole MySelf — DNJA, Factur-X, compta, parcelles IGN
            org.opencontainers.image.vendor=MySelf
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build & push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed digest ${{ steps.build.outputs.digest }}"

  smoke-test:
    name: Smoke test (amd64)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Pull & boot image
        run: |
          IMAGE_NAME_LC="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME_LC}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Testing $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name selffarm-smoke -p 8001:8001 "$IMAGE"
          sleep 8
          curl -fsS http://localhost:8001/healthz || (docker logs selffarm-smoke; exit 1)
          curl -fsS http://localhost:8001/ -o /dev/null -w "HTTP %{http_code}\n"
          docker stop selffarm-smoke
          docker rm selffarm-smoke
