name: CI

# 🔑 Aucun filtre de branche. La liste disait `dev` quand la branche de travail
# s'appelle `develop` : ruff, pytest et les validations YAML ne se sont lancés
# sur AUCUN commit de cette branche, et rien ne le signalait — seul gitleaks
# tournait, et son vert passait pour celui de la CI entière. Une liste de
# branches à tenir à jour finit toujours par diverger du nom réel, et le trou
# qu'elle ouvre est invisible.
on:
  push:
  pull_request:

jobs:
  test:
    name: Tests ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python deps
        # Le verrou, comme l'image Docker et le serveur de prod : ce qui est
        # testé ici est ce qui tourne là-bas.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          pip check

      - name: Lint (ruff)
        # webapp/ inclus depuis le 28/07/2026 : le périmètre était limité à
        # modules/, si bien que 124 erreurs y dormaient sans jamais remonter.
        # Un contrôle qui ne couvre pas tout ne protège que ce qu'il regarde.
        run: ruff check modules/ webapp/

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports --no-strict-optional modules/ || true

      - name: Run pytest
        # webapp/ inclus depuis le 28/07/2026 : ses tests existaient mais
        # n'étaient jamais exécutés, et 17 sur 18 échouaient en silence.
        # Ils couvrent notamment la génération du dossier DNJA en PDF.
        run: pytest modules/ webapp/ -v --cov=modules --cov=webapp --cov-report=term-missing

  verrou:
    name: Verrou à jour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python 3.13
        # La version qui a généré le verrou (en-tête de requirements.txt).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: requirements*.txt suivent pyproject.toml
        # Sans --upgrade, pip-compile garde chaque version figée qui satisfait
        # encore pyproject.toml : un écart veut dire que l'un a bougé sans l'autre.
        # L'en-tête (#…) est exclu : pip-compile n'y écrit pas les mêmes options
        # selon qu'il part d'un verrou existant ou non.
        shell: bash
        run: |
          pip install "pip-tools==$(sed -n 's/^pip-tools==//p' requirements-dev.txt)"
          cp requirements.txt "$RUNNER_TEMP/r.txt"
          cp requirements-dev.txt "$RUNNER_TEMP/rd.txt"
          pip-compile --quiet --allow-unsafe --strip-extras --extra pa \
            --output-file requirements.txt pyproject.toml
          pip-compile --quiet --allow-unsafe --strip-extras --extra pa --extra dev \
            -c requirements.txt --output-file requirements-dev.txt pyproject.toml
          diff <(grep -v '^#' "$RUNNER_TEMP/r.txt") <(grep -v '^#' requirements.txt)
          diff <(grep -v '^#' "$RUNNER_TEMP/rd.txt") <(grep -v '^#' requirements-dev.txt)

  venv-prod:
    name: Venv de prod
    # Le job test installe requirements-dev.txt : 20 paquets de plus que le venv
    # de prod, que deploy.sh ramène au seul requirements.txt. Ici, les gestes de
    # son étape 4 dans un venv neuf, puis l'application démarrée dessus.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Les gestes de l'étape 4 de deploy.sh
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps -e .
          "$RUNNER_TEMP/venv/bin/python" scripts/venv_suit_verrou.py requirements.txt
          "$RUNNER_TEMP/venv/bin/pip" check
      - name: L'application sert ses pages et un PDF
        env:
          SELFFARM_ENV: demo
          SELFFARM_DATA_DIR: ${{ runner.temp }}/data
        shell: bash
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c 'from self_agri_book.exploitation import save_exploitation, mark_onboarding_done
          save_exploitation({"nom": "Ferme de test", "statut": "JA", "commune": "Sainte-Foy", "saison_courante": 2026})
          mark_onboarding_done()'
          "$RUNNER_TEMP/venv/bin/uvicorn" webapp.main:app --host 127.0.0.1 --port 8001 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8001/healthz && break; sleep 1; done
          echo
          for page in / /compta; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8001$page")
            echo "$page : HTTP $code"; [ "$code" = 200 ]
          done
          type=$(curl -fsS -o "$RUNNER_TEMP/dnja.pdf" -w '%{content_type}' \
            "http://127.0.0.1:8001/dnja/pdf?example=hypotheses-demo-publique")
          echo "PDF DNJA : $type, $(stat -c %s "$RUNNER_TEMP/dnja.pdf") octets"; [ "$type" = application/pdf ]

  dernieres-versions:
    name: Dernières versions
    # Non exigé pour main : il annonce la rupture qu'apporterait la prochaine
    # mise à jour du verrou, avant qu'elle n'y entre.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Dernière version permise de chaque dépendance
        run: pip install -e ".[pa,dev]"
      - name: Run pytest
        run: pytest modules/ webapp/ -q

  manifeste:
    name: Manifeste des modules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: modules.json et le tableau du README suivent le code
        # Bibliothèque standard seule : aucune dépendance à installer.
        run: python3 scripts/ecosysteme.py manifeste

  yaml-validate:
    name: Valide YAML data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip pyyaml pydantic
      - name: Validate aides-agri-2026.yaml loads correctly
        run: |
          PYTHONPATH=modules python3 -c "
          from self_aid.loader import load_all
          aides = load_all()
          assert len(aides) >= 10, f'Trop peu d aides : {len(aides)}'
          print(f'{len(aides)} aides chargées OK')
          "

      - name: Validate PCG agricole YAML
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          d = yaml.safe_load(Path('modules/self_agri_book/data/pcg-agricole-2026.yaml').read_text())
          assert len(d.get('classes', [])) == 9, 'PCG doit avoir 9 classes'
          print('PCG agricole OK')
          "
