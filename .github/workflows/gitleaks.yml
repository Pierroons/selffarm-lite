name: gitleaks (OPSEC)

# Barrière dure : refuse tout push/PR introduisant une donnée sensible
# (identité, IP infra, IBAN réel, business perso…). Règles dans .gitleaks.toml.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet (baseline .gitleaksignore appliqué)
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
