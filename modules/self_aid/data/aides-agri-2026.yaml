# Base de données des aides agricoles — installation JA, 2026.
#
# Ce fichier ne contient que les aides NATIONALES et RÉGIONALES, dont les
# montants et conditions sont les mêmes pour tout le monde. Les aides
# départementales (conseils départementaux, montants DNJA régionalisés)
# dépendent de ton territoire : place-les dans data/local/, qui n'est pas
# versionné. Le loader additionne les deux.
#
# Sources : chaque aide porte son lien officiel dans le champ `source`.
# Cadence de vérification : 1er et 15 du mois (voir SelfJustice).

aides:
