  # --------------------------------------------------------------------------
  - code: "9"
    nom: "Comptabilité analytique (comptabilité de gestion)"
    note: >
      La classe 9 n'est pas normée par le PCG : chaque entité peut
      l'organiser librement pour sa comptabilité analytique. En
      exploitation agricole, elle sert typiquement à ventiler par
      atelier (cultures, élevage, atelier de transformation) ou par
      parcelle / troupeau pour suivre la rentabilité fine.
    incertain: true
    raison: >
      La classe 9 est laissée à la libre utilisation des entités par
      le PCG. Aucune codification officielle ANC ne s'y applique.
      Les exploitations agricoles utilisent souvent des référentiels
      professionnels (CER France, CNCER, Chambre d'agriculture).
    comptes: []
