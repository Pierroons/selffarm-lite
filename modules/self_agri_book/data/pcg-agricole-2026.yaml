# ----------------------------------------------------------------------------
# Plan Comptable Agricole - Version applicable 2026
# Fichier canonique pour le module self-agri-book de SelfFarm-Lite
#
# Construction : fusion de deux sources officielles primaires.
#   1. Règlement ANC n° 2014-03 relatif au Plan Comptable Général (PCG),
#      tel que modifie par le règlement ANC n° 2024-07 du 6 décembre 2024,
#      homologue par arrêté du 26 décembre 2025, applicable aux exercices
#      ouverts à compter du 1er janvier 2026.
#      -> Base commune (Plan-de-comptes-2026.pdf, ANC).
#   2. Arrêté du 11 décembre 1986 portant homologation du Plan Comptable
#      Général Agricole (PCGA), toujours la référence pour les subdivisions
#      spécifiques au secteur agricole non encore intégrées au PCG général.
#      Complete par le règlement ANC n° 2019-01 du 8 février 2019
#      (articles 618-8 à 618-11 du PCG) qui traite des biens vivants
#      immobilises et de l'évaluation des stocks et avances aux cultures.
#
# Les comptes marques `agri_specifique: true` sont propres au secteur
# agricole (non presents dans le PCG général ou subdivises differemment).
# ----------------------------------------------------------------------------

version_pcg: "PCG agricole - version applicable aux exercices ouverts à compter du 1er janvier 2026"

source:
  autorite: anc.gouv.fr
  date_maj_vu: "2026-04-22"
  publication: >
    Règlement ANC n° 2014-03 (PCG) modifie par règlement ANC n° 2024-07
    du 06/12/2024 (homologation arrêté du 26/12/2025), applicable au
    1er janvier 2026. Complete par le règlement ANC n° 2019-01 du
    08/02/2019 (activité agricole, art. 618-8 à 618-11 du PCG) et par
    l'arrêté du 11 décembre 1986 portant homologation du Plan Comptable
    Général Agricole (PCGA) pour les subdivisions sectorielles non
    encore integrees au PCG.
  references:
    - url: https://www.anc.gouv.fr/plan-comptable-general-0
      nom: "ANC - Plan comptable général"
    - url: https://www.anc.gouv.fr/files/anc/files/1_Normes_fran%C3%A7aises/Plans%20comptables/2026/Plan-de-comptes-2026.pdf
      nom: "Plan de comptes 2026 (PDF ANC)"
    - url: https://www.anc.gouv.fr/files/anc/files/1_Normes_fran%C3%A7aises/Reglements/2019/Reglt_2019_01/Reglt_2019-01_PCG_note-de-presentation_Agriculture.pdf
      nom: "ANC 2019-01 - Note de présentation activité agricole"
    - url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000029583307
      nom: "Légifrance - homologation règlements ANC"

notes_methodologiques:
  - >
    Les comptes à 3 chiffres du PCG 2026 sont la référence officielle.
    Les subdivisions à 4 chiffres reprennent soit le PCG 2026 quand
    elles y figurent, soit le PCGA 1986 (arrêté du 11/12/1986) pour
    les subdivisions proprement agricoles (semences, engrais,
    phyto, aliments, animaux, avances aux cultures, biens vivants...).
  - >
    Le PCGA 1986 codifiait certains comptes sur 5 chiffres (ex. 30110
    stocks d'engrais). Dans ce fichier, on aligne sur la logique PCG
    (4 chiffres) en preservant la granularité agricole.
  - >
    Comptes 657 / 757 : utilises pour les cessions habituelles de
    biens vivants immobilises (art. 618-8 du PCG - ANC 2019-01).
  - >
    Compte 218 "Cheptel" (PCG général) et compte 24 "Biens vivants
    immobilises" (PCGA) coexistent selon l'approche retenue par
    l'exploitation. Le PCGA utilise la classe 24 pour isoler les
    animaux reproducteurs et plantations pérennes.

