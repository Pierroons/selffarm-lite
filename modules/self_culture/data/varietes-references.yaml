# Catalogue de variétés de référence — self_culture
# Généré : 28 avril 2026 — 22:00 (Europe/Paris)
# Profil de référence : maraîchage AB en zone défavorisée + chanvre à fibres/fleurs
#
# Sources : ITAB (Institut technique de l'agriculture biologique),
#           GEVES (catalogue officiel FR des variétés), Kokopelli, Germinance,
#           sélectionneurs spécialisés (chanvre), retours de terrain de maraîchers.
#
# Densités et rendements en AB, fourchette indicative — à ajuster sur le
# terrain. Les variétés ont vocation à être étendues par l'utilisateur via
# la table `varietes_user` (catalogue de base + ajouts perso).

version: "2026-04"
