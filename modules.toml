# Déclaration des modules publiés par ce dépôt — la seule partie écrite à la main.
#
# `scripts/ecosysteme.py manifeste --ecrire` en tire `modules.json` et le tableau « Modules
# publiés » du README. Ce fichier ne porte que ce que le code ne sait pas : le nom affiché, le
# résumé, le dossier, et le module d'interface qui donne le statut. Le reste se lit ailleurs :
# - la version publiée est celle du dépôt, dans `VERSION` — les modules sortent ensemble ;
# - le statut vient de `status` dans `webapp/modules_catalog.py` (`live` / `soon`).
#
# Un paquet `modules/self_*` absent d'ici fait rougir le contrôle.
#
# `statut` explicite : réservé au module qui n'a pas d'écran propre au catalogue.

[[module]]
id = "self_agri_book"
nom = "self-agri-book"
dossier = "modules/self_agri_book"
catalogue = "compta"
resume.fr = "hub compta central — journal, bilan, compte de résultat, export FEC"
resume.en = "central accounting hub — journal, balance sheet, income statement, FEC export"

[[module]]
id = "self_invoice"
nom = "self-invoice"
dossier = "webapp/routes/invoice.py"
catalogue = "invoice"
resume.fr = "factures Factur-X pour trois régimes : franchise, micro-BA, réel"
resume.en = "Factur-X invoices for three French tax regimes: franchise, micro-BA, réel"

