# Hook local optionnel (framework pre-commit) — feedback rapide avant commit.
# Install : pipx install pre-commit && pre-commit install
# ⚠️ La révision doit rester alignée sur celle du workflow CI :
#    des versions différentes n'interprètent pas les allowlists pareil.
# (Le hook natif scripts/git-hooks/pre-commit fait la même chose sans dépendance.)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
