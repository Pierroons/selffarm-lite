<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SelfPOS Mobile — Marché</title>
<meta name="theme-color" content="#2d5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/pos/manifest-mobile.json">
<link rel="icon" type="image/svg+xml" href="/static/pos/icon.svg">
<style>
:root {
  --bg-base:        #0a0f0d;
  --bg-card:        #0f1814;
  --bg-elev:        #16261e;
  --border-subtle:  #1c302a;
  --border-default: #2a4035;
  --text-primary:   #e8efe9;
  --text-secondary: #9bb09f;
  --text-muted:     #6a8070;
  --accent-200:     #86a890;
  --accent-400:     #4a7c5e;
  --accent-500:     #2d5a3a;
  --accent-600:     #1f4e3d;
  --accent-bg-soft: rgba(45, 90, 58, 0.14);
  --warm-amber:     #d4a056;
  --warm-terra:     #b85751;
}
* {box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html, body {margin:0; padding:0; height:100%; background:var(--bg-base); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
button {font-family:inherit;}
a {color:var(--accent-200); text-decoration:none;}

/* === Layout app shell === */
.app {display:flex; flex-direction:column; height:100vh; height:100dvh;}
.topbar {
  background:var(--bg-elev); border-bottom:1px solid var(--border-subtle);
  padding:env(safe-area-inset-top, 12px) 14px 12px;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.topbar h1 {margin:0; font-size:15px; flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .status-dot {width:8px; height:8px; border-radius:50%;}
.status-dot.online {background:var(--accent-400);}
.status-dot.offline {background:var(--warm-amber);}
.topbar .status-text {font-size:10.5px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.4px;}

.content {flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px;}

.bottom-nav {
  background:var(--bg-elev); border-top:1px solid var(--border-subtle);
  display:flex; flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom, 0);
}
.bottom-nav .tab-btn {
  flex:1; padding:11px 4px;
  background:transparent; border:none; color:var(--text-muted);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:500;
  cursor:pointer; transition:color 0.1s;
}
.bottom-nav .tab-btn svg {width:20px; height:20px;}
.bottom-nav .tab-btn.active {color:var(--accent-200);}

/* === Cards / sections === */
.card {background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:12px; padding:16px; margin-bottom:14px;}
.card h2 {margin:0 0 10px 0; font-size:15px; font-weight:600;}
.card p {margin:0 0 12px 0; color:var(--text-secondary); font-size:13px; line-height:1.4;}

/* === Buttons === */
.btn {display:inline-block; padding:12px 18px; border:1px solid var(--accent-600); background:linear-gradient(180deg, var(--accent-500), var(--accent-600)); color:var(--text-primary); border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; width:100%;}
.btn:hover, .btn:active {filter:brightness(1.1);}
.btn:disabled {opacity:0.4; cursor:not-allowed;}
.btn-ghost {background:transparent; border:1px solid var(--border-default); color:var(--text-secondary);}
.btn-ghost:hover {border-color:var(--accent-500); color:var(--accent-200);}
.btn-warn {background:linear-gradient(180deg, var(--warm-amber), #b8884e); border-color:#b8884e; color:#1c1917;}

/* === Form === */
.field {display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label {font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; font-weight:600;}
.field input, .field select, .field textarea {background:#0a1410; border:1px solid var(--border-default); color:var(--text-primary); padding:11px 13px; border-radius:7px; font-size:15px; font-family:inherit;}
.field input:focus, .field select:focus {outline:none; border-color:var(--accent-500); box-shadow:0 0 0 3px var(--accent-bg-soft);}

/* === Catalog grid (caisse) === */
.produits-grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px;}
.produit-btn {
  background:var(--bg-card); border:1px solid var(--border-subtle);
  border-radius:11px; padding:10px 6px;
  cursor:pointer; user-select:none;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  min-height:96px;
}
.produit-btn:active {transform:scale(0.96); background:var(--accent-500);}
.produit-btn .emoji {font-size:24px; line-height:1;}
.produit-btn .nom {font-size:11.5px; font-weight:500; line-height:1.15; text-align:center;}
.produit-btn .prix {font-size:11px; color:var(--accent-200); font-weight:600;}
.produit-btn .stock-info {font-size:9.5px; color:var(--text-muted);}

/* === Panier === */
.panier {position:fixed; bottom:64px; left:0; right:0; background:var(--bg-elev); border-top:2px solid var(--accent-500); padding:12px 16px env(safe-area-inset-bottom, 12px); z-index:100; display:none;}
.panier.show {display:block;}
.panier-row {display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border-subtle); font-size:13px;}
.panier-row:last-of-type {border-bottom:none;}
.panier-row .emo {font-size:18px;}
.panier-row .info {flex:1; min-width:0;}
.panier-row .info .nom-l {font-size:13px; color:var(--text-primary);}
.panier-row .info .meta-l {font-size:10.5px; color:var(--text-muted);}
.panier-row .qty-ctrl {display:flex; align-items:center; gap:0; background:var(--bg-card); border-radius:5px;}
.panier-row .qty-ctrl button {background:transparent; color:var(--text-secondary); border:none; padding:4px 9px; font-size:16px; font-weight:600; cursor:pointer;}
.panier-row .qty-ctrl .qty-val {min-width:26px; text-align:center; font-size:12px; font-weight:600;}
.panier-row .total-l {min-width:60px; text-align:right; font-weight:600; font-feature-settings:'tnum';}

.panier-bar {display:flex; gap:8px; margin-top:10px;}
.panier-bar .total {flex:1; font-family:'Fraunces',serif; font-size:18px; color:var(--accent-200); font-weight:600; display:flex; align-items:center;}
.panier-bar .btn-encaisser {flex:1; padding:13px; font-size:14px;}

/* === Modal === */
.modal {position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:flex-end; justify-content:center;}
.modal.open {display:flex;}
.modal-content {background:var(--bg-card); border-top:2px solid var(--accent-500); padding:18px 18px env(safe-area-inset-bottom, 24px); border-radius:14px 14px 0 0; width:100%; max-width:560px; max-height:85vh; overflow-y:auto;}
.modal h3 {margin:0 0 6px 0; font-size:16px; font-weight:600;}
.modal .sub {margin:0 0 14px 0; font-size:12.5px; color:var(--text-secondary);}
.modal-actions {display:flex; gap:8px; margin-top:14px;}
.modal-actions button {flex:1; padding:11px;}

/* === Pavé de pesée === */
.pesee-display {display:flex; justify-content:space-between; align-items:baseline; background:var(--bg-elev); padding:14px 16px; border-radius:8px; margin-bottom:14px;}
.pesee-display .pesee-aff {font-family:'Fraunces',serif; font-size:26px; color:var(--text-primary); font-weight:600;}
.pesee-display .pesee-sous {font-size:15px; color:var(--accent-200); font-weight:600;}
.keypad {display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.keypad button {padding:16px 0; font-size:20px; font-weight:600; background:var(--bg-elev); border:1px solid var(--border-subtle); border-radius:8px; color:var(--text-primary); cursor:pointer; font-family:inherit;}
.keypad button:active {background:var(--accent-500);}
.keypad button.kp-back {color:var(--text-secondary);}

.payment-grid {display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px;}
.payment-grid .opt {padding:14px 8px; background:var(--bg-elev); border:2px solid var(--border-subtle); border-radius:8px; text-align:center; font-size:12.5px; cursor:pointer;}
.payment-grid .opt.selected {border-color:var(--accent-500); background:var(--accent-bg-soft); color:var(--accent-200);}
.payment-grid .opt .emo-pay {font-size:24px; display:block; margin-bottom:4px;}

/* === Empty / hint === */
.empty {text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px;}
.empty svg {width:42px; height:42px; opacity:0.4; margin-bottom:12px;}

/* === Toast === */
.toast {position:fixed; top:env(safe-area-inset-top, 14px); left:14px; right:14px; background:var(--bg-card); border-left:4px solid var(--accent-500); padding:12px 14px; border-radius:8px; font-size:13px; z-index:300; box-shadow:0 4px 16px rgba(0,0,0,0.4); display:none;}
.toast.show {display:block;}
.toast.warn {border-left-color:var(--warm-amber);}
.toast.error {border-left-color:var(--warm-terra);}

/* === Section toggle visibility produits === */
.toggle-row {display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-subtle);}
.toggle-row:last-child {border-bottom:none;}
.toggle-row .emo {font-size:22px;}
.toggle-row .info {flex:1;}
.toggle-row .info .nom {font-size:14px;}
.toggle-row .info .meta {font-size:11px; color:var(--text-muted);}

.switch {position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input {display:none;}
.switch span {position:absolute; inset:0; background:var(--border-default); border-radius:12px; cursor:pointer; transition:background 0.2s;}
.switch span::before {content:''; position:absolute; left:3px; top:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform 0.2s;}
.switch input:checked + span {background:var(--accent-500);}
.switch input:checked + span::before {transform:translateX(18px);}

/* === Tableau résidus (fin de marché) === */
.residus-table {width:100%; background:var(--bg-card); border-radius:10px; overflow:hidden;}
.residus-table .row {display:grid; grid-template-columns:1fr auto auto; gap:8px; padding:12px; border-bottom:1px solid var(--border-subtle); align-items:center;}
.residus-table .row:last-child {border-bottom:none;}
.residus-table .info-prod {min-width:0;}
.residus-table .info-prod .nom-r {font-size:14px; font-weight:500;}
.residus-table .info-prod .meta-r {font-size:11px; color:var(--text-muted);}
.residus-table input[type=number] {width:64px; padding:7px 8px; background:#0a1410; border:1px solid var(--border-default); color:var(--text-primary); border-radius:5px; font-size:12.5px;}
.residus-table select {padding:7px 8px; background:#0a1410; border:1px solid var(--border-default); color:var(--text-primary); border-radius:5px; font-size:12px; font-family:inherit; max-width:130px;}

/* === Sessions list === */
.session-card {background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.session-card .head {display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.session-card .lieu {font-size:14px; font-weight:500;}
.session-card .total {color:var(--accent-200); font-weight:600; font-feature-settings:'tnum';}
.session-card .meta {font-size:11.5px; color:var(--text-muted);}

</style>
<script src="/static/js/actions.js"></script>
</head>
<body data-version="{{ version }}">

<div class="app" id="app">

  <!-- Topbar -->
  <div class="topbar">
    <button id="pcStatusBtn" title="Statut connexion PC SelfFarm — clic pour re-checker" style="background:transparent; border:1px solid var(--border-default); padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text-secondary); font-size:11px;">
      <span class="status-dot" id="pcDot" style="background:#666;"></span>
      <span id="pcLabel">PC ?</span>
    </button>
    <h1 id="screenTitle">SelfPOS Mobile</h1>
    <span class="status-text" id="netText" style="margin-left:auto;">Hors ligne</span>
  </div>

  <!-- Content (zone scrollable) -->
  <div class="content" id="content"></div>

  <!-- Panier flottant -->
  <div class="panier" id="panier"></div>

  <!-- Bottom nav -->
  <div class="bottom-nav" id="bottomNav">
    <button class="tab-btn active" data-screen="caisse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Caisse</span>
    </button>
    <button class="tab-btn" data-screen="catalogue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Catalogue</span>
    </button>
    <button class="tab-btn" data-screen="sessions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Sessions</span>
    </button>
    <button class="tab-btn" data-screen="coffre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Coffre</span>
    </button>
    <button class="tab-btn" data-screen="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v10m11-11h-6M7 12H1"/></svg>
      <span>Réglages</span>
    </button>
  </div>
</div>

<!-- Modal encaissement -->
<div class="modal" id="modalPay" data-action="close-pay-overlay">
  <div class="modal-content">
    <h3>Encaisser</h3>
    <p class="sub">Mode de paiement utilisé</p>
    <div style="background:var(--bg-elev); padding:12px 16px; border-radius:8px; margin-bottom:14px; display:flex; justify-content:space-between;">
      <span style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Total</span>
      <span id="modalPayTotal" style="font-family:'Fraunces',serif; font-size:22px; color:var(--accent-200); font-weight:600;"></span>
    </div>
    <div class="payment-grid">
      <div class="opt" data-mode="especes" data-action="select-pay"><span class="emo-pay">💵</span>Espèces</div>
      <div class="opt" data-mode="cb" data-action="select-pay"><span class="emo-pay">💳</span>Carte</div>
      <div class="opt" data-mode="cheque" data-action="select-pay"><span class="emo-pay">🧾</span>Chèque</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-pay">Annuler</button>
      <button class="btn" id="btnConfirmPay" disabled data-action="confirm-pay">Valider</button>
    </div>
  </div>
</div>

<!-- Pavé de pesée (saisie du poids in-app, comme une vraie caisse mobile) -->
<div class="modal" id="modalPesee" data-action="pesee-overlay">
  <div class="modal-content">
    <h3 id="peseeNom">Pesée</h3>
    <p class="sub">Saisis le poids lu sur la balance</p>
    <div class="pesee-display">
      <span class="pesee-aff" id="peseeAff">0 kg</span>
      <span class="pesee-sous" id="peseeSous">0,00 €</span>
    </div>
    <div class="keypad">
      <button data-action="pesee-key" data-key="7">7</button>
      <button data-action="pesee-key" data-key="8">8</button>
      <button data-action="pesee-key" data-key="9">9</button>
      <button data-action="pesee-key" data-key="4">4</button>
      <button data-action="pesee-key" data-key="5">5</button>
      <button data-action="pesee-key" data-key="6">6</button>
      <button data-action="pesee-key" data-key="1">1</button>
      <button data-action="pesee-key" data-key="2">2</button>
      <button data-action="pesee-key" data-key="3">3</button>
      <button data-action="pesee-key" data-key=",">,</button>
      <button data-action="pesee-key" data-key="0">0</button>
      <button class="kp-back" data-action="pesee-backspace">⌫</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="pesee-annuler">Annuler</button>
      <button class="btn" data-action="pesee-valider">Valider</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/static/pos/mobile.js"></script>
</body>
</html>
