  DÉMO PUBLIQUE — installation fictive d'une JA en Dordogne (Bourg-de-Démonstration).
  Combinaison maraîchage bio diversifié (40 légumes) + PPAM bio (lavande, thym, menthe,
  mélisse) transformées en tisanes artisanales. Vente directe AMAP + marché + magasin
  de producteurs. Démarrage progressif sur 4 ans, plein régime N+4.
  Ce prévisionnel sert uniquement à illustrer les fonctionnalités de SelfFarm-Lite.

