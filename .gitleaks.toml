# Règles gitleaks — OPSEC MySelf
# Détection GÉNÉRIQUE : ne nomme aucune information personnelle, donc le détecteur
# ne révèle pas lui-même ce qu'il protège (repo public). Vigilance manuelle pour
# l'identité civile (non détectable génériquement sans la nommer).
# Scan : gitleaks detect (historique) | gitleaks protect --staged (avant commit)
title = "MySelf OPSEC"

[extend]
useDefault = true   # ~150 règles natives (clés API, tokens, IBAN, etc.)

# ─────────────────── Règles maison (génériques) ───────────────────
[[rules]]
id = "myself-email-perso"
description = "Email personnel grand public (utiliser un alias, ex contact@my-self.fr)"
regex = '''(?i)\b[a-z0-9._%+-]+@(gmx|gmail|googlemail|outlook|hotmail|live|msn|yahoo|ymail|proton|protonmail|pm\.me|laposte|orange|free|sfr|wanadoo|bbox|numericable)\.[a-z]{2,}\b'''

[rules.allowlist]
description = "Adresses de demonstration explicitement fictives"
regexTarget = "match"
regexes = [
  '''(?i)(exemple|example|demo|test|fake|fictif)''',
  '''(?i)\b(alice|bob|carol|dave|eve|mallory|sophie[._]martin)\b''',
]
tags = ["opsec", "identity"]

[[rules]]
id = "myself-code-postal-local"
description = "Code postal localisant l'auteur, en contexte d'adresse (suivi d'une commune)"
# Le code postal SEUL produisait trop de bruit : montants, identifiants, et
# jusqu'à des fragments hexadécimaux de vecteurs de test cryptographiques.
# Un chiffre isolé ne localise personne ; suivi d'un nom de commune, si.
regex = '''\b23\d{3}\s+[A-ZÀ-Ÿ][a-zà-ÿ]'''
tags = ["opsec", "geo"]

[[rules]]
id = "myself-ip-lan"
description = "IP LAN d'infra perso (RFC1918)"
regex = '''\b(10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2})\b'''

[rules.allowlist]
description = "Plages de documentation (RFC 5737) et adresses de reseau banales"
regexTarget = "match"
regexes = [
  '''\b(192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}\b''',
  '''\b10\.0\.0\.\d{1,3}\b''',
  '''\b(10\.0\.0\.0|172\.16\.0\.0|192\.168\.0\.0)\b''',
  '''\b192\.168\.(0|1)\.(0|1|10|20|30|50|100|254)\b''',
]
tags = ["opsec", "infra"]

[[rules]]
id = "myself-chemin-perso"
description = "Chemin disque perso / arborescence locale"
regex = '''/home/[a-z][a-z0-9_-]+|Documents generes'''

[rules.allowlist]
description = "Comptes systeme et generiques — n'identifient personne"
regexTarget = "match"
regexes = ['''/home/(user|users|deploy|myself|runner|ubuntu|debian|admin|www-data|node|app)\b''']
tags = ["opsec", "infra"]

[[rules]]
id = "myself-iban"
description = "IBAN francais (doit etre fictif FR76 0000... en demo)"
regex = '''FR\d{2}[ ]?\d{4}[ ]?\d{4}[ ]?\d{4}'''

[rules.allowlist]
description = "IBAN de demonstration"
regexTarget = "match"
regexes = ['''FR\d{2} ?0000''', '''FR\d{2} ?1234 ?5678''', '''FR76 ?3000 ?4000 ?0512''']
tags = ["opsec", "finance"]

# ─────────────────────────── Faux positifs ───────────────────────────
[allowlist]
description = "Chemins et motifs surs"
paths = [
  '''_perso/''',
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''__pycache__/''',
  '''\.pyc$''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.mypy_cache/''',
  '''(^|/)data/''',
  '''.*wordlist.*''',
  '''.*diceware.*''',
  '''eff_fr\.json''',
  '''zxcvbn\.js''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.gitleaksignore$''',
  '''(^|/)CONTRIBUTING\.md$''',
]
regexes = [
  # Comptes système et génériques : /home/<quelquechose> n'identifie personne.
  # Seuls les logins réels doivent déclencher la règle.
  '''/home/(user|users|deploy|myself|runner|ubuntu|debian|admin|www-data|node|app)\b''',
  # Plages réservées à la documentation (RFC 5737) et adresses de réseau banales.
  '''\b(192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}\b''',
  '''\b10\.0\.0\.\d{1,3}\b''',
  # Notations de plage RFC1918 en documentation réseau : une plage n'est pas
  # une adresse, elle ne désigne aucune machine.
  '''\b(10\.0\.0\.0|172\.16\.0\.0|192\.168\.0\.0)\b''',
  '''\b192\.168\.(0|1)\.(0|1|10|20|30|50|100|254)\b''',
  # Adresses de démonstration explicitement fictives.
  '''(?i)(exemple|example|demo|test|fake|fictif)''',
  '''(?i)\b(alice|bob|carol|dave|eve|mallory|sophie[._]martin)\b''',
  # IBAN de démonstration, avec ou sans espaces.
  '''FR\d{2} ?0000''',
  '''FR\d{2} ?1234 ?5678''',
  # IBAN de démonstration du simulateur d'attaque (code banque générique des
  # exemples français, suite de chiffres manifestement séquentielle).
  '''FR76 ?3000 ?4000 ?0512''',
  # Mots de passe de test des suites de sécurité (alice/bob/carol).
  '''(alice|bob|carol|dave)-pwd-[0-9]+''',
  '''vault_key_b64''',
  '''FR76 0000''',
  '''FR76 ?1234 ?5678''',
  '''contact@my-self\.fr''',
  '''/home/user\b''',
  '''192\.168\.1\.(0|10|50)\b''',
  '''correct horse battery staple''',
]
