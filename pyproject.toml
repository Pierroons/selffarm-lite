[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selffarm-lite"
dynamic = ["version"]
description = "Modules agricoles ciblés pour jeunes agriculteurs (JA) français"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Pierroons", email = "contact@my-self.fr" }
]
keywords = ["agriculture", "dnja", "dja", "facturx", "pcg-agricole"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "fastapi>=0.110,<1.0",
    # Starlette 1.0.0 introduit un breakpoint sur Jinja2Templates (cache key dict)
    # → épinglé < 1.0 tant que Starlette ne republie pas de fix
    "starlette>=0.40,<1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "segno>=1.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
facturx = ["drafthorse>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
self-dnja = "self_dnja.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["modules"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["modules"]
