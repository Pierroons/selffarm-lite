[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selffarm-lite"
dynamic = ["version"]
description = "Modules agricoles ciblés pour jeunes agriculteurs (JA) français"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Pierroons", email = "contact@my-self.fr" }
]
keywords = ["agriculture", "dnja", "dja", "facturx", "pcg-agricole"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "fastapi>=0.110,<1.0",
    # Starlette >= 1.0 impose TemplateResponse(request, name, context). L'ordre
    # historique faisait arriver le contexte à la place du nom du template
    # (TypeError: unhashable type: 'dict') — ce n'était pas un bug de Starlette,
    # donc le plafond n'avait pas de terme. Les 52 appels de webapp/routes ont été
    # migrés le 08/09/2026 : la suite passe 18/18 sur 0.52.1, 1.3.1 et 1.6.0.
    # Lever le plafond referme CVE-2026-54283 (request.form() ignore max_fields et
    # max_part_size, DoS par formulaire) et CVE-2026-48818 (UNC dans StaticFiles,
    # Windows seulement — mais une cible Windows est au programme).
    "starlette>=1.3.1",
    # anyio arrive par starlette, qui n'en borne pas la version. Plancher posé
    # ici pour CVE-2026-63374 et CVE-2026-63349 (HIGH, corrigées en 4.14.2),
    # relevées par Trivy sur le venv de prod le 23/09/2026.
    "anyio>=4.14.2",
    # Planchers de dépendances transitives, lus sur OSV le 03/11/2026 pour les
    # versions alors figées (pillow et brotli relevés par la veille CVE du venv
    # de prod le 30/10/2026) :
    # pillow (weasyprint, pdfplumber) : 41 avis GHSA sur la 12.3.0, dont 5
    # critiques (GHSA-332p-7hrc-92wf, -5x8w-8jj5-q52h, -8g5g-8vmr-9782,
    # -v9pv-5gc8-w2m6, -w889-685w-c8fh), tous corrigés en 13.0.0 seulement.
    "pillow>=13.0.0",
    # brotli (fonttools[woff], par weasyprint) : GHSA-9v8h-qqgm-4m35, critique.
    "brotli>=1.2.1",
    # opentelemetry-api (fastapi) : GHSA-xcq7-p3pf-p88h, modérée.
    "opentelemetry-api>=1.45.1",
    "uvicorn[standard]>=0.27",
    # Plancher posé pour CVE-2026-53537, -53538, -53539 (corrigées en 0.0.30) et
    # CVE-2026-53540 (0.0.31), la plus récente que liste OSV le 04/10/2026.
    "python-multipart>=0.0.31",
    "itsdangerous>=2.1",
    "cryptography>=42",
    # Lecture des relevés bancaires en PDF (self_banking).
    "pdfplumber>=0.11",
    "segno>=1.6",
    "psutil>=5.9",
]

# Les versions installées ne se lisent pas ici : requirements.txt (et
# requirements-dev.txt) les fige, généré depuis ce fichier par pip-compile.
[project.optional-dependencies]
# Réception des factures via une Plateforme Agréée (module self_pa). Optionnel :
# une installation qui n'y est pas raccordée n'a pas besoin du client HTTP.
# certifi arrive par httpx : plancher pour GHSA-6q48-6c7w-9gw2 (critique, OSV
# le 03/11/2026), corrigée en 2026.10.18.
pa = ["httpx>=0.27", "certifi>=2026.10.18"]
# Sauvegarde distante SFTP (self_backup.remote). Hors du verrou, donc hors de
# l'image Docker et de la prod : venv_suit_verrou.py la retirerait d'un venv que
# deploy.sh ramène au verrou. Plancher : GHSA-r374-rxx8-8654 touche jusqu'à la
# 4.0.0 (OSV le 04/11/2026), la version suivante est la 5.0.0.
sftp = ["paramiko>=5.0.0"]
# reportlab ne sert qu'à scripts/generate_sg_fake_statement.py.
# setuptools arrive par pip-tools : plancher pour GHSA-xmj3-9gf7-h52w (faible,
# Windows ; OSV et Dependabot le 04/11/2026), corrigée en 84.1.0.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27",
       "pip-tools>=7.4", "reportlab>=4.0", "setuptools>=84.1.0"]

[project.scripts]
self-dnja = "self_dnja.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["modules"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ011 / DTZ005 — écartées en connaissance de cause.
# Ces règles exigent une timezone explicite sur date.today() et datetime.now().
# Elles sont justes pour un service multi-fuseaux ; elles ne le sont pas ici.
# SelfFarm est local-first et mono-poste : « aujourd'hui » doit être la date
# LOCALE de l'utilisateur, celle de sa machine. Passer par UTC daterait de la
# veille toute saisie faite après 22 h en France — un relevé de ponte du soir
# se retrouverait sur le mauvais jour. Figer Europe/Paris reviendrait par
# ailleurs à réimplémenter date.today() en moins portable.
#
# DTZ007 — même famille : les relevés bancaires importés (parser SG) ne
# portent aucun fuseau. Exiger %z dans strptime imposerait d'inventer une
# information absente de la source.
#
# B008 — faux positif sur FastAPI : `File(...)`, `Query(...)`, `Depends(...)`
# en valeur par défaut d'argument SONT l'idiome du framework, pas un piège de
# mutable partagé.
ignore = ["DTZ011", "DTZ005", "DTZ007", "B008"]

[tool.ruff.lint.per-file-ignores]
# BLE001 — la couche web est une couche de présentation : une exception non
# prévue doit dégrader l'affichage, jamais renvoyer une 500 à un agriculteur au
# milieu d'un marché. Le `except Exception` y est délibéré.
# ⚠️ Contrepartie non négociable : ces blocs LOGUENT. Un silence complet
# (`except: pass`) reste un défaut — cf. les trois corrigés le 28/07/2026, dont
# un retry de sauvegarde qui échouait sans laisser de trace.
"webapp/**" = ["BLE001"]

[tool.pytest.ini_options]
# webapp inclus depuis le 28/07/2026 : ces tests existaient mais n'étaient
# jamais exécutés, et 17 sur 18 échouaient sans que rien ne le signale.
testpaths = ["modules", "webapp"]
