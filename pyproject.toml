[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selffarm-lite"
dynamic = ["version"]
description = "Modules agricoles ciblés pour jeunes agriculteurs (JA) français"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Pierroons", email = "contact@my-self.fr" }
]
keywords = ["agriculture", "dnja", "dja", "facturx", "pcg-agricole"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "fastapi>=0.110,<1.0",
    # Starlette 1.0.0 introduit un breakpoint sur Jinja2Templates (cache key dict)
    # → épinglé < 1.0 tant que Starlette ne republie pas de fix
    "starlette>=0.40,<1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "segno>=1.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
facturx = ["drafthorse>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
self-dnja = "self_dnja.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["modules"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ011 / DTZ005 — écartées en connaissance de cause.
# Ces règles exigent une timezone explicite sur date.today() et datetime.now().
# Elles sont justes pour un service multi-fuseaux ; elles ne le sont pas ici.
# SelfFarm est local-first et mono-poste : « aujourd'hui » doit être la date
# LOCALE de l'utilisateur, celle de sa machine. Passer par UTC daterait de la
# veille toute saisie faite après 22 h en France — un relevé de ponte du soir
# se retrouverait sur le mauvais jour. Figer Europe/Paris reviendrait par
# ailleurs à réimplémenter date.today() en moins portable.
#
# DTZ007 — même famille : les relevés bancaires importés (parser SG) ne
# portent aucun fuseau. Exiger %z dans strptime imposerait d'inventer une
# information absente de la source.
#
# B008 — faux positif sur FastAPI : `File(...)`, `Query(...)`, `Depends(...)`
# en valeur par défaut d'argument SONT l'idiome du framework, pas un piège de
# mutable partagé.
ignore = ["DTZ011", "DTZ005", "DTZ007", "B008"]

[tool.ruff.lint.per-file-ignores]
# BLE001 — la couche web est une couche de présentation : une exception non
# prévue doit dégrader l'affichage, jamais renvoyer une 500 à un agriculteur au
# milieu d'un marché. Le `except Exception` y est délibéré.
# ⚠️ Contrepartie non négociable : ces blocs LOGUENT. Un silence complet
# (`except: pass`) reste un défaut — cf. les trois corrigés le 28/07/2026, dont
# un retry de sauvegarde qui échouait sans laisser de trace.
"webapp/**" = ["BLE001"]

[tool.pytest.ini_options]
# webapp inclus depuis le 28/07/2026 : ces tests existaient mais n'étaient
# jamais exécutés, et 17 sur 18 échouaient sans que rien ne le signale.
testpaths = ["modules", "webapp"]
